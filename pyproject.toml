[project]
name = "cyanodiff"
version = "0.2.0"
description = "MDLM-based cyanobacteria promoter design with controllable expression"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    # core
    "torch>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "biopython",
    # optimal transport (Wasserstein eval)
    "pot",
    # plots
    "matplotlib",
    "seaborn",
    # config & logging
    "pyyaml",
    "wandb",
    "rich",
    "python-dotenv",
    # data / misc
    "openpyxl",
    "tqdm",
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
